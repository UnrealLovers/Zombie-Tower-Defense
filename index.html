<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zombie Tower Defense: Ultimate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background-color: #0f172a; touch-action: none; user-select: none; }
        canvas { display: block; width: 100vw; height: 100vh; }
        .glass-panel { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border-top: 1px solid rgba(255,255,255,0.1); }
        .btn-buy { transition: all 0.2s; border: 1px solid rgba(255,255,255,0.2); }
        .btn-buy:hover:not(:disabled) { border-color: #38bdf8; box-shadow: 0 0 15px rgba(56,189,248,0.5); transform: translateY(-2px); }
        .btn-buy:disabled { opacity: 0.4; filter: grayscale(100%); cursor: not-allowed; }
        .btn-active { border-color: #a855f7 !important; box-shadow: 0 0 20px rgba(168,85,247,0.7) !important; background: rgba(168,85,247,0.2) !important; }
        .blueprint-card { transition: all 0.3s; cursor: pointer; border: 2px solid transparent; }
        .blueprint-card:hover { border-color: #fcd34d; box-shadow: 0 0 25px rgba(252,211,77,0.6); transform: scale(1.05); }
        /* Scrollbar tersembunyi untuk UI bersih */
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="text-white font-sans antialiased">

    <!-- Area Render Utama -->
    <canvas id="gameCanvas"></canvas>

    <!-- Top HUD -->
    <div class="fixed top-0 left-0 w-full p-4 pointer-events-none flex justify-between items-start z-10">
        <div class="flex gap-4 items-center">
            <div class="bg-slate-900/80 p-3 rounded-lg border border-slate-700 shadow-[0_0_15px_rgba(0,0,0,0.5)]">
                <div class="text-xs text-slate-400 font-bold tracking-wider">CREDITS</div>
                <div class="text-2xl font-black text-amber-400" id="ui-gold">1500</div>
            </div>
            <div class="bg-slate-900/80 p-3 rounded-lg border border-slate-700">
                <div class="text-xs text-slate-400 font-bold tracking-wider" id="ui-phase-text">PREPARATION PHASE</div>
                <div class="text-2xl font-black text-red-500" id="ui-wave">WAVE 1</div>
            </div>
        </div>
        <div class="bg-slate-900/80 p-3 rounded-lg border border-slate-700 text-right">
            <div class="text-xs text-slate-400 font-bold tracking-wider">CORE INTEGRITY</div>
            <div class="w-48 h-3 bg-slate-800 rounded-full mt-1 overflow-hidden border border-slate-600">
                <div id="ui-core-hp" class="h-full bg-cyan-400 shadow-[0_0_10px_#22d3ee] transition-all" style="width: 100%;"></div>
            </div>
        </div>
    </div>

    <!-- Bottom HUD: Tactical Command Deck -->
    <div class="fixed bottom-0 left-0 w-full glass-panel z-20 pointer-events-auto flex flex-col p-2">
        <div class="text-xs text-slate-400 font-bold tracking-widest mb-2 px-4">TACTICAL COMMAND DECK</div>
        
        <div class="flex gap-4 overflow-x-auto px-4 pb-2 items-end">
            <!-- Grid Defenses -->
            <div class="flex gap-2 border-r border-slate-700 pr-4">
                <button class="btn-buy bg-slate-800 rounded-xl p-2 w-20 h-24 flex flex-col items-center justify-between" onclick="Game.selectItem('gun_turret', 150)">
                    <div class="w-8 h-8 bg-slate-400 rounded-sm mt-2"></div>
                    <div class="text-[10px] font-bold text-center leading-tight">Gun Turret<br><span class="text-amber-400 text-xs">150</span></div>
                </button>
                <button class="btn-buy bg-slate-800 rounded-xl p-2 w-20 h-24 flex flex-col items-center justify-between" onclick="Game.selectItem('laser_turret', 300)">
                    <div class="w-8 h-8 rounded-full border-4 border-cyan-400 shadow-[0_0_10px_#22d3ee] mt-2"></div>
                    <div class="text-[10px] font-bold text-center leading-tight">Laser Turret<br><span class="text-amber-400 text-xs">300</span></div>
                </button>
                <button id="btn-tesla" class="btn-buy bg-slate-800 rounded-xl p-2 w-20 h-24 flex-col items-center justify-between hidden" onclick="Game.selectItem('tesla_turret', 3000)">
                    <div class="w-8 h-8 rounded-full border-4 border-purple-500 shadow-[0_0_15px_#a855f7] flex items-center justify-center mt-2">
                        <div class="w-2 h-2 bg-purple-300 rounded-full"></div>
                    </div>
                    <div class="text-[10px] font-bold text-center leading-tight text-purple-300">Tesla Singularity<br><span class="text-amber-400 text-xs">3000</span></div>
                </button>
            </div>

            <!-- Mobile Forces -->
            <div class="flex gap-2 border-r border-slate-700 pr-4">
                <button class="btn-buy bg-slate-800 rounded-xl p-2 w-20 h-24 flex flex-col items-center justify-between" onclick="Game.buyMobile('infantry', 200)">
                    <div class="w-6 h-6 bg-emerald-400 rounded-full shadow-[0_0_8px_#34d399] mt-2"></div>
                    <div class="text-[10px] font-bold text-center leading-tight">Infantry AT<br><span class="text-amber-400 text-xs">200</span></div>
                </button>
                <button class="btn-buy bg-slate-800 rounded-xl p-2 w-20 h-24 flex flex-col items-center justify-between" onclick="Game.buyMobile('car', 350)">
                    <div class="w-10 h-6 bg-blue-500 rounded-md shadow-[0_0_8px_#3b82f6] mt-2"></div>
                    <div class="text-[10px] font-bold text-center leading-tight">Armored Car<br><span class="text-amber-400 text-xs">350</span></div>
                </button>
                <button class="btn-buy bg-slate-800 rounded-xl p-2 w-20 h-24 flex flex-col items-center justify-between" onclick="Game.buyMobile('tank', 600)">
                    <div class="w-12 h-8 border-2 border-green-600 bg-green-800 rounded-sm mt-2 relative">
                        <div class="absolute w-8 h-2 bg-green-500 top-1/2 right-[-10px] -translate-y-1/2"></div>
                    </div>
                    <div class="text-[10px] font-bold text-center leading-tight">Heavy Tank<br><span class="text-amber-400 text-xs">600</span></div>
                </button>
                <button id="btn-titan" class="btn-buy bg-slate-800 rounded-xl p-2 w-20 h-24 flex-col items-center justify-between hidden" onclick="Game.buyMobile('titan', 3500)">
                    <div class="w-10 h-10 bg-orange-600 border-2 border-orange-300 shadow-[0_0_15px_#ea580c] rounded-sm mt-1 flex items-center justify-center">
                        <div class="w-4 h-4 bg-orange-200 rounded-full"></div>
                    </div>
                    <div class="text-[10px] font-bold text-center leading-tight text-orange-400">Titan Goliath<br><span class="text-amber-400 text-xs">3500</span></div>
                </button>
            </div>

            <!-- Support & Mega Weapons -->
            <div class="flex gap-2 pr-4 border-r border-slate-700">
                <button class="btn-buy bg-red-900/50 rounded-xl p-2 w-20 h-24 flex flex-col items-center justify-between border border-red-500/50" onclick="Game.selectItem('orbital', 400)">
                    <div class="w-4 h-10 bg-white rounded-t-full border-b-4 border-red-500 shadow-[0_0_10px_#ef4444] mt-1"></div>
                    <div class="text-[10px] font-bold text-center leading-tight text-red-200">Orbital Strike<br><span class="text-amber-400 text-xs">400</span></div>
                </button>
                <button id="btn-chrono" class="btn-buy bg-blue-900/50 rounded-xl p-2 w-20 h-24 flex-col items-center justify-between border border-blue-500/50 hidden" onclick="Game.selectItem('chrono', 1500)">
                    <div class="w-2 h-12 bg-white shadow-[0_0_15px_#3b82f6,0_0_30px_#ffffff] mt-1"></div>
                    <div class="text-[10px] font-bold text-center leading-tight text-blue-200">Chrono Beam<br><span class="text-amber-400 text-xs">1500</span></div>
                </button>
            </div>

            <!-- Utilities -->
            <div class="flex gap-2 ml-auto">
                <button class="btn-buy bg-slate-800 rounded-xl p-2 h-12 px-4 flex items-center justify-center" onclick="Game.repairWall()">
                    <span class="text-xs font-bold">Repair Wall (200C)</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Roguelike Modal -->
    <div id="modal-roguelike" class="fixed inset-0 z-50 bg-slate-900/90 backdrop-blur-md hidden flex-col items-center justify-center pointer-events-auto">
        <h2 class="text-4xl font-black text-amber-400 mb-2 drop-shadow-[0_0_10px_rgba(251,191,36,0.8)]">WAVE CLEARED</h2>
        <p class="text-slate-300 mb-8">Select a Tactical Enhancement to proceed</p>
        <div id="cards-container" class="flex gap-6">
            <!-- Cards Injected via JS -->
        </div>
    </div>

    <!-- Game Over Modal -->
    <div id="modal-gameover" class="fixed inset-0 z-50 bg-red-950/95 backdrop-blur-lg hidden flex-col items-center justify-center pointer-events-auto">
        <h1 class="text-6xl font-black text-red-500 mb-4 drop-shadow-[0_0_20px_rgba(239,68,68,1)]">SANCTUARY FALLEN</h1>
        <p class="text-xl text-slate-300 mb-8" id="go-wave-text">You survived until Wave X</p>
        <button class="px-8 py-4 bg-red-600 hover:bg-red-500 text-white font-bold rounded-xl shadow-[0_0_15px_rgba(239,68,68,0.6)] transition-all" onclick="location.reload()">INITIATE RESTART</button>
    </div>

    <script>
        // --- ARCHITECTURE & UTILS ---
        class Vec2 {
            constructor(x, y) { this.x = x; this.y = y; }
            add(v) { return new Vec2(this.x + v.x, this.y + v.y); }
            sub(v) { return new Vec2(this.x - v.x, this.y - v.y); }
            mult(n) { return new Vec2(this.x * n, this.y * n); }
            mag() { return Math.sqrt(this.x * this.x + this.y * this.y); }
            normalize() { let m = this.mag(); return m === 0 ? new Vec2(0,0) : new Vec2(this.x/m, this.y/m); }
            dist(v) { return this.sub(v).mag(); }
            angle() { return Math.atan2(this.y, this.x); }
        }

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let W = window.innerWidth;
        let H = window.innerHeight;
        
        // Base Layout Boundaries (Left Side)
        let BASE_WIDTH = W * 0.25;
        const WALL_X = BASE_WIDTH;
        
        window.addEventListener('resize', () => {
            W = window.innerWidth; H = window.innerHeight;
            canvas.width = W; canvas.height = H;
            BASE_WIDTH = W * 0.25;
        });
        window.dispatchEvent(new Event('resize'));

        // --- GAME STATE ---
        const STATE = {
            gold: 1200,
            wave: 1,
            isNight: false,
            activeTarget: null, // item selected for placement
            entities: {
                zombies: [],
                turrets: [],
                mobiles: [],
                particles: [],
                texts: [],
                supports: [] // Orbital strikes, Chrono beams
            },
            stats: {
                coreHp: 5000, coreMax: 5000,
                wallHp: 2000, wallMax: 2000,
                turretDmgMult: 1.0,
                mobileHpMult: 1.0,
            },
            blueprints: {
                tesla: false,
                titan: false,
                chrono: false
            },
            mouse: new Vec2(0,0),
            frame: 0
        };

        // --- ENTITY CLASSES ---
        class Entity {
            constructor(x, y, maxHp) {
                this.pos = new Vec2(x, y);
                this.maxHp = maxHp * STATE.stats.mobileHpMult;
                this.hp = this.maxHp;
                this.dead = false;
                this.vel = new Vec2(0,0);
            }
            takeDamage(amt) {
                this.hp -= amt;
                if(this.hp <= 0) this.dead = true;
                spawnText(this.pos.x, this.pos.y - 20, `-${Math.floor(amt)}`, '#ef4444');
            }
            drawHealthBar(ctx, w, yOffset) {
                if (this.hp < this.maxHp && this.hp > 0) {
                    const pct = Math.max(0, this.hp / this.maxHp);
                    ctx.fillStyle = '#ef4444';
                    ctx.fillRect(this.pos.x - w/2, this.pos.y - yOffset, w, 4);
                    ctx.fillStyle = '#22c55e';
                    ctx.fillRect(this.pos.x - w/2, this.pos.y - yOffset, w * pct, 4);
                }
            }
        }

        class Zombie extends Entity {
            constructor(type) {
                const y = H/2 - 150 + Math.random() * 300;
                super(W + 50, y, 1);
                this.type = type;
                this.freezeTimer = 0;
                
                switch(type) {
                    case 'basic': this.maxHp=100; this.speed=1.0; this.dmg=10; this.r=12; this.color='#84cc16'; this.reward=15; break;
                    case 'fast': this.maxHp=60; this.speed=2.5; this.dmg=5; this.r=10; this.color='#fef08a'; this.reward=20; break;
                    case 'tank': this.maxHp=500; this.speed=0.5; this.dmg=30; this.r=20; this.color='#166534'; this.reward=50; break;
                    case 'boss': this.maxHp=2500; this.speed=0.4; this.dmg=100; this.r=35; this.color='#991b1b'; this.reward=300; break;
                    case 'dragon': this.maxHp=8000; this.speed=0.8; this.dmg=150; this.r=45; this.color='#581c87'; this.reward=1000; this.isFlying=true; break;
                }
                this.hp = this.maxHp * (1 + (STATE.wave * 0.15)); // Scaling
                this.attackCooldown = 0;
            }
            update() {
                if (this.freezeTimer > 0) {
                    this.freezeTimer--;
                    return; // Stunned
                }

                let target = null;
                let minDist = Infinity;

                // Find nearest blocking mobile unit
                STATE.entities.mobiles.forEach(m => {
                    if(!this.isFlying && !m.isFlying) {
                        let d = this.pos.dist(m.pos);
                        if(d < minDist) { minDist = d; target = m; }
                    }
                });

                if(target && minDist < this.r + target.r + 5) {
                    // Attack Unit
                    if(this.attackCooldown <= 0) {
                        target.takeDamage(this.dmg);
                        this.attackCooldown = 60;
                        spawnParticles(this.pos.x, this.pos.y, '#ef4444', 5);
                    }
                } else if (this.pos.x <= WALL_X + this.r) {
                    // Attack Wall
                    if(this.attackCooldown <= 0) {
                        STATE.stats.wallHp -= this.dmg;
                        if(STATE.stats.wallHp <= 0) STATE.stats.coreHp -= this.dmg;
                        this.attackCooldown = 60;
                        spawnParticles(WALL_X, this.pos.y, '#94a3b8', 5);
                        triggerScreenShake(2);
                    }
                } else {
                    // Move left
                    this.pos.x -= this.speed;
                }
                this.attackCooldown--;
            }
            draw() {
                ctx.save();
                ctx.translate(this.pos.x, this.pos.y);
                if(this.freezeTimer > 0) {
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = '#3b82f6';
                }
                
                ctx.fillStyle = this.color;
                ctx.beginPath();
                if(this.type === 'dragon') {
                    // Draw Dragon Shape
                    ctx.moveTo(20, 0); ctx.lineTo(-20, -30); ctx.lineTo(-10, 0); ctx.lineTo(-20, 30); ctx.closePath();
                    ctx.fill();
                    // Flapping wings animation
                    if(STATE.frame % 30 < 15 && this.freezeTimer <= 0) {
                        ctx.fillStyle = 'rgba(88, 28, 135, 0.5)';
                        ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(30, -50); ctx.lineTo(-20, -50); ctx.fill();
                        ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(30, 50); ctx.lineTo(-20, 50); ctx.fill();
                    }
                } else {
                    ctx.arc(0, 0, this.r, 0, Math.PI*2);
                    ctx.fill();
                    // Eyes
                    ctx.fillStyle = '#000';
                    ctx.beginPath(); ctx.arc(-this.r/2, -this.r/3, 2, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.arc(-this.r/2, this.r/3, 2, 0, Math.PI*2); ctx.fill();
                }
                ctx.restore();
                this.drawHealthBar(ctx, this.r * 2, this.r + 8);
            }
        }

        class Turret extends Entity {
            constructor(x, y, type) {
                super(x, y, type==='tesla'?2000:500);
                this.type = type;
                this.cooldown = 0;
                this.lightningTargets = []; // For Tesla UI
                if(type === 'gun') { this.range=250; this.dmg=25; this.rate=15; this.color='#94a3b8'; }
                if(type === 'laser') { this.range=350; this.dmg=60; this.rate=45; this.color='#22d3ee'; }
                if(type === 'tesla') { this.range=300; this.dmg=8; this.rate=2; this.color='#a855f7'; }
            }
            update() {
                this.cooldown--;
                this.lightningTargets = [];
                
                let inRange = STATE.entities.zombies.filter(z => this.pos.dist(z.pos) <= this.range);
                if(inRange.length === 0) return;

                if(this.type === 'tesla') {
                    // Mega Weapon: Tesla - CC Pull & Chain Lightning
                    if(this.cooldown <= 0) {
                        inRange.forEach(z => {
                            z.takeDamage(this.dmg * STATE.stats.turretDmgMult);
                            // Suck effect (Pull towards turret)
                            if(!z.isFlying && z.type !== 'boss') {
                                let dir = this.pos.sub(z.pos).normalize();
                                z.pos = z.pos.add(dir.mult(1.5));
                            }
                            this.lightningTargets.push(z.pos);
                        });
                        this.cooldown = this.rate;
                    }
                } else {
                    // Gun / Laser target single nearest
                    let target = inRange.reduce((a, b) => this.pos.dist(a.pos) < this.pos.dist(b.pos) ? a : b);
                    this.angle = target.pos.sub(this.pos).angle();

                    if(this.cooldown <= 0) {
                        target.takeDamage(this.dmg * STATE.stats.turretDmgMult);
                        this.cooldown = this.rate;
                        
                        // Visuals
                        if(this.type === 'gun') spawnParticles(this.pos.x, this.pos.y, '#fbbf24', 3);
                        if(this.type === 'laser') {
                            ctx.strokeStyle = '#22d3ee'; ctx.lineWidth = 4;
                            ctx.beginPath(); ctx.moveTo(this.pos.x, this.pos.y); ctx.lineTo(target.pos.x, target.pos.y); ctx.stroke();
                        }
                    }
                }
            }
            draw() {
                ctx.save();
                ctx.translate(this.pos.x, this.pos.y);
                
                if(this.type === 'tesla') {
                    // Draw Tesla Structure
                    ctx.shadowBlur = 15; ctx.shadowColor = '#a855f7';
                    ctx.fillStyle = '#1e1b4b'; ctx.fillRect(-15, -15, 30, 30);
                    ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI*2);
                    ctx.strokeStyle = '#a855f7'; ctx.lineWidth=3; ctx.stroke();
                    ctx.fillStyle = '#d8b4fe'; ctx.fill();
                    
                    // Animate Rings
                    ctx.rotate(STATE.frame * 0.05);
                    ctx.strokeRect(-12, -12, 24, 24);
                } else {
                    ctx.fillStyle = '#334155';
                    ctx.fillRect(-15, -15, 30, 30);
                    ctx.rotate(this.angle || 0);
                    ctx.fillStyle = this.color;
                    ctx.fillRect(0, -5, 20, 10);
                }
                ctx.restore();

                // Draw Tesla Lightning Arcs
                if(this.type === 'tesla' && this.lightningTargets.length > 0) {
                    ctx.save();
                    ctx.strokeStyle = '#d8b4fe';
                    ctx.shadowBlur = 10; ctx.shadowColor = '#a855f7';
                    ctx.lineWidth = 2;
                    this.lightningTargets.forEach(tpos => {
                        ctx.beginPath();
                        ctx.moveTo(this.pos.x, this.pos.y);
                        // Zigzag effect
                        let midX = (this.pos.x + tpos.x)/2 + (Math.random()*20-10);
                        let midY = (this.pos.y + tpos.y)/2 + (Math.random()*20-10);
                        ctx.lineTo(midX, midY);
                        ctx.lineTo(tpos.x, tpos.y);
                        ctx.stroke();
                    });
                    ctx.restore();
                }

                this.drawHealthBar(ctx, 30, 25);
            }
        }

        class MobileUnit extends Entity {
            constructor(type) {
                const y = H/2 - 100 + Math.random() * 200;
                super(BASE_WIDTH - 20, y, 1);
                this.type = type;
                this.vel = new Vec2(1, 0);
                this.targetAngle = 0;
                
                switch(type) {
                    case 'infantry': this.maxHp=150; this.r=10; this.speed=1.2; this.range=150; this.dmg=20; this.rate=30; this.color='#34d399'; break;
                    case 'car': this.maxHp=400; this.r=15; this.speed=2.5; this.range=120; this.dmg=15; this.rate=10; this.color='#3b82f6'; break;
                    case 'tank': this.maxHp=1200; this.r=22; this.speed=0.6; this.range=200; this.dmg=100; this.rate=90; this.color='#15803d'; break;
                    case 'titan': this.maxHp=4000; this.r=35; this.speed=0.3; this.range=180; this.dmg=12; this.rate=5; this.color='#ea580c'; break;
                }
                this.hp = this.maxHp * STATE.stats.mobileHpMult;
                this.cooldown = 0;
            }
            update() {
                this.cooldown--;
                let nearestZ = null;
                let minDist = Infinity;
                
                STATE.entities.zombies.forEach(z => {
                    let d = this.pos.dist(z.pos);
                    if(d < minDist) { minDist = d; nearestZ = z; }
                });

                if(nearestZ && minDist <= this.range) {
                    // Attack
                    this.targetAngle = nearestZ.pos.sub(this.pos).angle();
                    
                    if(this.cooldown <= 0) {
                        if(this.type === 'titan') {
                            // Flamethrower AoE Cone
                            STATE.entities.zombies.forEach(z => {
                                let d = this.pos.dist(z.pos);
                                if(d <= this.range) {
                                    let angleToZ = z.pos.sub(this.pos).angle();
                                    let diff = Math.abs(angleToZ - this.targetAngle);
                                    if(diff < 0.5 || diff > Math.PI*2 - 0.5) { // Roughly 30 deg cone
                                        z.takeDamage(this.dmg);
                                        spawnParticles(z.pos.x, z.pos.y, '#ea580c', 1);
                                    }
                                }
                            });
                            spawnParticles(this.pos.x + Math.cos(this.targetAngle)*40, this.pos.y + Math.sin(this.targetAngle)*40, '#f59e0b', 5, 2);
                        } else {
                            // Normal single target
                            nearestZ.takeDamage(this.dmg);
                            spawnParticles(this.pos.x, this.pos.y, '#fbbf24', 3);
                            if(this.type === 'tank') triggerScreenShake(1);
                        }
                        this.cooldown = this.rate;
                    }
                } else if (this.pos.x < W - 150) {
                    // Move Forward
                    this.pos.x += this.speed;
                    this.targetAngle = 0;
                }
            }
            draw() {
                ctx.save();
                ctx.translate(this.pos.x, this.pos.y);
                ctx.rotate(this.targetAngle);
                
                if(this.type === 'infantry') {
                    ctx.fillStyle = this.color; ctx.beginPath(); ctx.arc(0,0,this.r,0,Math.PI*2); ctx.fill(); // Body
                    ctx.fillStyle = '#1e293b'; ctx.fillRect(5, -3, 12, 6); // Gun
                } else if (this.type === 'car') {
                    ctx.fillStyle = '#1e293b'; ctx.fillRect(-15, -12, 10, 4); ctx.fillRect(5, -12, 10, 4); // Top wheels
                    ctx.fillRect(-15, 8, 10, 4); ctx.fillRect(5, 8, 10, 4); // Bot wheels
                    ctx.fillStyle = this.color; ctx.fillRect(-15, -10, 30, 20); // Chassis
                    ctx.fillStyle = '#94a3b8'; ctx.fillRect(0, -2, 20, 4); // MG
                } else if (this.type === 'tank') {
                    ctx.fillStyle = '#0f172a'; ctx.fillRect(-20, -18, 40, 8); ctx.fillRect(-20, 10, 40, 8); // Tracks
                    ctx.fillStyle = this.color; ctx.fillRect(-15, -12, 30, 24); // Hull
                    ctx.fillStyle = '#14532d'; ctx.beginPath(); ctx.arc(0,0,12,0,Math.PI*2); ctx.fill(); // Turret base
                    ctx.fillStyle = '#475569'; ctx.fillRect(0, -3, 25, 6); // Barrel
                } else if (this.type === 'titan') {
                    ctx.shadowBlur = 10; ctx.shadowColor = '#ea580c';
                    ctx.fillStyle = '#78350f'; ctx.fillRect(-15, -25, 30, 50); // Broad shoulders
                    ctx.fillStyle = this.color; ctx.beginPath(); ctx.arc(0,0,18,0,Math.PI*2); ctx.fill(); // Core
                    ctx.fillStyle = '#fbbf24'; ctx.fillRect(10, -8, 25, 16); // Flamethrower arm
                }
                ctx.restore();
                this.drawHealthBar(ctx, this.r*2, this.r+10);
            }
        }

        class ChronoBeam {
            constructor(x) {
                this.x = x;
                this.timer = 420; // 7 seconds at 60fps
                this.width = 120;
            }
            update() {
                this.timer--;
                // Freeze and damage zombies intersecting X coord
                STATE.entities.zombies.forEach(z => {
                    if(Math.abs(z.pos.x - this.x) < this.width/2 + z.r) {
                        z.freezeTimer = 60; // Keep frozen
                        z.takeDamage(5); // Rapid tick damage
                    }
                });
                triggerScreenShake(1); // Rumble
            }
            draw() {
                ctx.save();
                ctx.globalCompositeOperation = 'lighter';
                ctx.fillStyle = `rgba(59, 130, 246, ${Math.random()*0.3 + 0.5})`; // Flashing blue
                ctx.shadowBlur = 30; ctx.shadowColor = '#60a5fa';
                ctx.fillRect(this.x - this.width/2, 0, this.width, H);
                ctx.fillStyle = `rgba(255, 255, 255, ${Math.random()*0.5 + 0.5})`; // Inner core
                ctx.fillRect(this.x - this.width/4, 0, this.width/2, H);
                ctx.restore();
            }
        }

        class Particle {
            constructor(x,y,color,spd=1) {
                this.pos = new Vec2(x,y);
                this.vel = new Vec2((Math.random()-0.5)*5*spd, (Math.random()-0.5)*5*spd);
                this.color = color;
                this.life = 1.0;
                this.decay = 0.02 + Math.random()*0.03;
            }
            update() { this.pos = this.pos.add(this.vel); this.life -= this.decay; }
            draw() {
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.fillStyle = this.color;
                ctx.fillRect(this.pos.x, this.pos.y, 4, 4);
                ctx.globalAlpha = 1.0;
            }
        }

        // --- CORE SYSTEMS ---
        let shake = 0;
        function triggerScreenShake(amt) { shake = amt; }
        
        function spawnParticles(x, y, color, count, spd=1) {
            for(let i=0; i<count; i++) STATE.entities.particles.push(new Particle(x,y,color,spd));
        }
        function spawnText(x, y, text, color) {
            STATE.entities.texts.push({x, y, text, color, life: 1.0});
        }

        const Game = {
            init() {
                // Attach listeners
                canvas.addEventListener('mousemove', e => { STATE.mouse.x = e.clientX; STATE.mouse.y = e.clientY; });
                canvas.addEventListener('click', () => {
                    if(STATE.activeTarget) {
                        const t = STATE.activeTarget;
                        if(STATE.gold >= t.cost) {
                            if(t.type === 'orbital') {
                                STATE.gold -= t.cost;
                                spawnParticles(STATE.mouse.x, STATE.mouse.y, '#ef4444', 50, 3);
                                STATE.entities.zombies.forEach(z => {
                                    if(z.pos.dist(STATE.mouse) < 150) z.takeDamage(1000);
                                });
                                triggerScreenShake(15);
                            } else if (t.type === 'chrono') {
                                STATE.gold -= t.cost;
                                STATE.entities.supports.push(new ChronoBeam(STATE.mouse.x));
                            } else {
                                // Turrets
                                if(STATE.mouse.x < WALL_X && STATE.mouse.x > 50) {
                                    STATE.gold -= t.cost;
                                    STATE.entities.turrets.push(new Turret(STATE.mouse.x, STATE.mouse.y, t.type));
                                }
                            }
                            this.updateUI();
                        }
                        this.clearSelection();
                    }
                });
                this.updateUI();
                this.loop();
            },
            
            selectItem(type, cost) {
                if(STATE.activeTarget && STATE.activeTarget.type === type) { this.clearSelection(); return; }
                if(STATE.gold >= cost) {
                    STATE.activeTarget = {type, cost};
                    document.querySelectorAll('.btn-buy').forEach(b => b.classList.remove('btn-active'));
                    event.currentTarget.classList.add('btn-active');
                    canvas.style.cursor = 'crosshair';
                }
            },
            
            buyMobile(type, cost) {
                this.clearSelection();
                if(STATE.gold >= cost) {
                    STATE.gold -= cost;
                    STATE.entities.mobiles.push(new MobileUnit(type));
                    this.updateUI();
                }
            },
            
            repairWall() {
                this.clearSelection();
                if(STATE.gold >= 200 && STATE.stats.wallHp < STATE.stats.wallMax) {
                    STATE.gold -= 200;
                    STATE.stats.wallHp = Math.min(STATE.stats.wallMax, STATE.stats.wallHp + 1000);
                    spawnText(WALL_X, H/2, "+REPAIR", "#22c55e");
                    this.updateUI();
                }
            },
            
            clearSelection() {
                STATE.activeTarget = null;
                canvas.style.cursor = 'default';
                document.querySelectorAll('.btn-buy').forEach(b => b.classList.remove('btn-active'));
            },

            updateUI() {
                document.getElementById('ui-gold').innerText = Math.floor(STATE.gold);
                document.getElementById('ui-wave').innerText = `WAVE ${STATE.wave}`;
                
                const hpPct = Math.max(0, STATE.stats.coreHp / STATE.stats.coreMax * 100);
                const hpBar = document.getElementById('ui-core-hp');
                hpBar.style.width = `${hpPct}%`;
                hpBar.style.backgroundColor = hpPct < 30 ? '#ef4444' : '#22d3ee';

                document.querySelectorAll('.btn-buy').forEach(btn => {
                    const cost = parseInt(btn.innerText.match(/\d+$/)?.[0] || '0');
                    btn.disabled = STATE.gold < cost;
                });
                
                if(STATE.stats.coreHp <= 0) {
                    document.getElementById('modal-gameover').style.display = 'flex';
                    document.getElementById('go-wave-text').innerText = `You defended Sanctuary until Wave ${STATE.wave}`;
                }
            },

            manageWaves() {
                // Simple spawn logic based on time & wave
                if(!STATE.isNight && STATE.frame % 600 === 0 && STATE.frame > 0) {
                    STATE.isNight = true;
                    document.getElementById('ui-phase-text').innerText = "ASSAULT IN PROGRESS";
                    document.getElementById('ui-phase-text').classList.add('text-red-500', 'animate-pulse');
                    spawnText(W/2, 100, "NIGHT FALLS", "#ef4444");
                }

                if(STATE.isNight && STATE.frame % (Math.max(20, 120 - STATE.wave*5)) === 0) {
                    let type = 'basic';
                    let r = Math.random();
                    if(STATE.wave % 5 === 0 && r < 0.1) type = 'boss';
                    else if (STATE.wave % 20 === 0 && r < 0.05) type = 'dragon';
                    else if (STATE.wave > 3 && r < 0.3) type = 'fast';
                    else if (STATE.wave > 6 && r < 0.2) type = 'tank';
                    STATE.entities.zombies.push(new Zombie(type));
                }

                // End Wave Condition
                if(STATE.isNight && STATE.frame % 3600 === 0) {
                    STATE.isNight = false;
                    document.getElementById('ui-phase-text').innerText = "PREPARATION PHASE";
                    document.getElementById('ui-phase-text').classList.remove('text-red-500', 'animate-pulse');
                    this.showRoguelikeCards();
                }
            },

            showRoguelikeCards() {
                const modal = document.getElementById('modal-roguelike');
                const container = document.getElementById('cards-container');
                container.innerHTML = '';
                
                // Define Pool
                let pool = [
                    {title: "Bio-Ammo", desc: "+20% Turret Damage", action: () => STATE.stats.turretDmgMult += 0.2},
                    {title: "Heavy Plating", desc: "+1000 Wall HP Max", action: () => { STATE.stats.wallMax+=1000; STATE.stats.wallHp+=1000; }},
                    {title: "Combat Stims", desc: "+30% Mobile Unit HP", action: () => STATE.stats.mobileHpMult += 0.3},
                    {title: "Stimulus Check", desc: "+1500 Credits", action: () => STATE.gold += 1500}
                ];

                // Blueprint Injections
                if(STATE.wave >= 5 && !STATE.blueprints.tesla) {
                    pool.push({title: "Blueprint: Tesla", desc: "Unlocks Tesla Singularity", color: "border-purple-500", action: () => { STATE.blueprints.tesla = true; document.getElementById('btn-tesla').classList.remove('hidden'); document.getElementById('btn-tesla').classList.add('flex'); }});
                }
                if(STATE.wave >= 10 && !STATE.blueprints.titan) {
                    pool.push({title: "Blueprint: Titan", desc: "Unlocks Goliath Mech", color: "border-orange-500", action: () => { STATE.blueprints.titan = true; document.getElementById('btn-titan').classList.remove('hidden'); document.getElementById('btn-titan').classList.add('flex'); }});
                }
                if(STATE.wave >= 15 && !STATE.blueprints.chrono) {
                    pool.push({title: "Blueprint: Chrono", desc: "Unlocks Chrono Beam", color: "border-blue-500", action: () => { STATE.blueprints.chrono = true; document.getElementById('btn-chrono').classList.remove('hidden'); document.getElementById('btn-chrono').classList.add('flex'); }});
                }

                // Pick 3 random
                pool.sort(() => 0.5 - Math.random());
                const selection = pool.slice(0,3);

                selection.forEach(card => {
                    let div = document.createElement('div');
                    div.className = `blueprint-card bg-slate-800 p-6 rounded-2xl flex flex-col items-center justify-center text-center w-64 h-80 ${card.color || 'border-slate-600'}`;
                    div.innerHTML = `
                        <div class="text-xl font-black text-white mb-2">${card.title}</div>
                        <div class="text-sm text-slate-400">${card.desc}</div>
                    `;
                    div.onclick = () => {
                        card.action();
                        STATE.wave++;
                        this.updateUI();
                        modal.style.display = 'none';
                    };
                    container.appendChild(div);
                });

                modal.style.display = 'flex';
            },

            drawEnvironment() {
                // Ground
                ctx.fillStyle = STATE.isNight ? '#020617' : '#0f172a';
                ctx.fillRect(0, 0, W, H);

                // Grid pattern
                ctx.strokeStyle = 'rgba(255,255,255,0.03)';
                ctx.lineWidth = 1;
                for(let i=0; i<W; i+=50) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,H); ctx.stroke(); }
                for(let i=0; i<H; i+=50) { ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(W,i); ctx.stroke(); }

                // Base Sanctuary Area
                ctx.fillStyle = 'rgba(30, 41, 59, 0.5)';
                ctx.fillRect(0, 0, BASE_WIDTH, H);
                
                // Nexus Core
                ctx.shadowBlur = 30; ctx.shadowColor = '#22d3ee';
                ctx.fillStyle = '#0891b2';
                ctx.beginPath(); ctx.arc(BASE_WIDTH/2, H/2, 60, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#cffafe';
                ctx.beginPath(); ctx.arc(BASE_WIDTH/2, H/2, 20 + Math.sin(STATE.frame*0.05)*10, 0, Math.PI*2); ctx.fill();
                ctx.shadowBlur = 0;

                // Main Wall (Bunker Style)
                ctx.fillStyle = '#334155';
                ctx.fillRect(WALL_X - 30, 0, 30, H);
                
                // Wall Health Visual
                let wallPct = Math.max(0, STATE.stats.wallHp / STATE.stats.wallMax);
                ctx.fillStyle = '#22c55e';
                ctx.fillRect(WALL_X - 10, 0, 10, H * wallPct);
                
                // Energy Shield Overlay
                ctx.globalCompositeOperation = 'lighter';
                ctx.fillStyle = `rgba(34, 211, 238, ${wallPct * 0.2 + (Math.sin(STATE.frame*0.1)*0.05)})`;
                ctx.fillRect(WALL_X, 0, 15, H);
                ctx.globalCompositeOperation = 'source-over';
            },

            loop() {
                if(STATE.stats.coreHp > 0 && document.getElementById('modal-roguelike').style.display !== 'flex') {
                    STATE.frame++;
                    this.manageWaves();

                    // Pre-update Memory Cleanup
                    STATE.entities.zombies = STATE.entities.zombies.filter(e => !e.dead);
                    STATE.entities.turrets = STATE.entities.turrets.filter(e => !e.dead);
                    STATE.entities.mobiles = STATE.entities.mobiles.filter(e => !e.dead);
                    STATE.entities.supports = STATE.entities.supports.filter(e => e.timer > 0);
                    STATE.entities.particles = STATE.entities.particles.filter(e => e.life > 0);
                    STATE.entities.texts = STATE.entities.texts.filter(e => e.life > 0);

                    // Update Entities
                    Object.values(STATE.entities).forEach(arr => arr.forEach(e => e.update()));

                    // Post-update Loot Logic
                    STATE.entities.zombies.forEach(z => {
                        if(z.hp <= 0 && !z.dead) { // Just died this frame
                            STATE.gold += z.reward;
                            this.updateUI();
                            spawnParticles(z.pos.x, z.pos.y, z.color, 15, 2);
                        }
                    });
                }

                // Render Setup
                ctx.save();
                if(shake > 0) {
                    ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
                    shake *= 0.9;
                    if(shake < 0.5) shake = 0;
                }

                this.drawEnvironment();

                // Draw Entities
                STATE.entities.turrets.forEach(e => e.draw());
                STATE.entities.mobiles.forEach(e => e.draw());
                STATE.entities.zombies.forEach(e => e.draw());
                STATE.entities.supports.forEach(e => e.draw());
                STATE.entities.particles.forEach(e => e.draw());

                // Floating Texts
                ctx.font = "bold 16px sans-serif";
                ctx.textAlign = "center";
                STATE.entities.texts.forEach(t => {
                    ctx.fillStyle = t.color;
                    ctx.globalAlpha = t.life;
                    ctx.fillText(t.text, t.x, t.y);
                    t.y -= 1;
                    t.life -= 0.02;
                    ctx.globalAlpha = 1.0;
                });

                // Placement Preview
                if(STATE.activeTarget) {
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
                    if(STATE.activeTarget.type === 'orbital' || STATE.activeTarget.type === 'chrono') {
                        ctx.beginPath(); ctx.arc(STATE.mouse.x, STATE.mouse.y, 150, 0, Math.PI*2); ctx.fill();
                        ctx.strokeStyle = 'red'; ctx.stroke();
                    } else if (STATE.mouse.x < WALL_X && STATE.mouse.x > 50) {
                        ctx.fillRect(STATE.mouse.x - 15, STATE.mouse.y - 15, 30, 30);
                    }
                }

                ctx.restore();
                requestAnimationFrame(() => this.loop());
            }
        };

        // Start Game
        window.Game = Game; // Expose to global for HTML onclicks
        Game.init();
    </script>
</body>
</html>
